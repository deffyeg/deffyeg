<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64">
  <style>
    .spinner {
      transform-origin: 32px 32px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <circle cx="32" cy="32" r="19"
          fill="none" stroke="#30363d" stroke-width="5"/>
  <path class="spinner"
        d="M32 13a19 19 0 0 1 19 19"
        fill="none" stroke="#8d0000" stroke-width="5"
        stroke-linecap="round"/>
  <text x="64" y="38" fill="#f2f2f2"
        font-family="Arial, sans-serif" font-size="17">
    Loading repositories...
  </text>
</svg>
